<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Announcements | MAGIC Youth Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0f13; }
    input, select, textarea { background: #1a1a2e !important; border-color: #374151 !important; color: #f3f4f6 !important; }
    input:focus, select:focus, textarea:focus { border-color: #7c3aed !important; outline: none !important; box-shadow: 0 0 0 2px rgba(124,58,237,0.2) !important; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }
  </style>
</head>
<body class="text-gray-100">
  <div id="sidebarContainer"></div>
  <div class="md:ml-64 min-h-screen">
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-800 text-gray-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div><h1 class="text-lg font-bold text-white">Announcements</h1><p class="text-gray-500 text-xs">Manage public notices and announcements</p></div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-2 bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>New Announcement
      </button>
    </header>
    <main class="p-6">
      <div id="announcementsList" class="space-y-4">
        <div class="text-gray-500 text-sm">Loading announcements...</div>
      </div>
    </main>
  </div>

  <div id="modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-lg shadow-2xl">
      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-800">
        <h2 class="text-lg font-semibold text-white" id="modalTitle">New Announcement</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-white transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
      </div>
      <form id="annForm" class="p-6 space-y-4">
        <input type="hidden" id="annId">
        <div><label class="block text-xs font-medium text-gray-400 mb-1.5">Title *</label><input type="text" id="annTitle" required placeholder="Announcement title" class="w-full rounded-xl px-4 py-2.5 text-sm border"></div>
        <div><label class="block text-xs font-medium text-gray-400 mb-1.5">Content</label><textarea id="annContent" rows="4" placeholder="Full announcement text..." class="w-full rounded-xl px-4 py-2.5 text-sm border resize-none"></textarea></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-xs font-medium text-gray-400 mb-1.5">Priority</label>
            <select id="annPriority" class="w-full rounded-xl px-4 py-2.5 text-sm border">
              <option value="high">🔴 High</option>
              <option value="normal" selected>🟡 Normal</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
          <div class="flex items-end pb-0.5"><div class="flex items-center gap-2"><input type="checkbox" id="annActive" class="w-4 h-4 accent-yellow-500" checked><label for="annActive" class="text-sm text-gray-300">Active / Visible</label></div></div>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-700 text-gray-300 hover:bg-gray-800 text-sm transition">Cancel</button>
          <button type="submit" id="submitBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-medium transition">Post</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    let editingId = null;
    const PRIORITY_STYLES = { high: 'border-red-700/50 bg-red-900/10', normal: 'border-yellow-700/50 bg-yellow-900/10', low: 'border-green-700/50 bg-green-900/10' };
    const PRIORITY_BADGE = { high: 'bg-red-900/40 text-red-300', normal: 'bg-yellow-900/40 text-yellow-300', low: 'bg-green-900/40 text-green-300' };

    document.addEventListener('DOMContentLoaded', async () => { await loadSidebar('announcements'); loadAnnouncements(); });

    async function loadAnnouncements() {
      try {
        const data = await api('/api/announcements?all=1');
        renderList(data.data);
      } catch { showToast('Failed to load announcements.', 'error'); }
    }

    function renderList(items) {
      const list = document.getElementById('announcementsList');
      if (items.length === 0) {
        list.innerHTML = `<div class="text-gray-500 text-sm py-8">No announcements yet. <button onclick="openModal()" class="text-yellow-400 hover:underline">Create one!</button></div>`;
        return;
      }
      list.innerHTML = items.map(a => `
        <div class="bg-gray-900 border ${PRIORITY_STYLES[a.priority] || PRIORITY_STYLES.normal} rounded-2xl p-5 flex items-start justify-between gap-4">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-2">
              <span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium ${PRIORITY_BADGE[a.priority]} capitalize">${a.priority}</span>
              ${a.isActive ? '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-green-900/40 text-green-400 border border-green-800/50">Active</span>' : '<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium bg-gray-800 text-gray-500">Inactive</span>'}
              <span class="text-gray-600 text-xs">${formatDate(a.createdAt)}</span>
            </div>
            <h3 class="text-white font-semibold text-sm">${a.title}</h3>
            ${a.content ? `<p class="text-gray-400 text-sm mt-1">${a.content}</p>` : ''}
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <button onclick="toggleActive('${a._id}', ${a.isActive})" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-yellow-400 transition" title="${a.isActive ? 'Deactivate' : 'Activate'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${a.isActive ? 'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21' : 'M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z'}"/></svg>
            </button>
            <button onclick="editAnn('${a._id}')" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-purple-400 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
            <button onclick="deleteAnn('${a._id}', '${a.title.replace(/'/g, "\\'")}')"
              class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-red-400 transition"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
          </div>
        </div>
      `).join('');
    }

    function openModal(data = null) {
      editingId = data ? data._id : null;
      document.getElementById('modalTitle').textContent = data ? 'Edit Announcement' : 'New Announcement';
      document.getElementById('annId').value = data?._id || '';
      document.getElementById('annTitle').value = data?.title || '';
      document.getElementById('annContent').value = data?.content || '';
      document.getElementById('annPriority').value = data?.priority || 'normal';
      document.getElementById('annActive').checked = data ? !!data.isActive : true;
      document.getElementById('submitBtn').textContent = data ? 'Save Changes' : 'Post';
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); editingId = null; }

    document.getElementById('annForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Saving...';
      try {
        const payload = { title: document.getElementById('annTitle').value, content: document.getElementById('annContent').value, priority: document.getElementById('annPriority').value, is_active: document.getElementById('annActive').checked ? '1' : '0' };
        if (editingId) { await api(`/api/announcements/${editingId}`, { method: 'PUT', body: JSON.stringify(payload) }); showToast('Updated!'); }
        else { await api('/api/announcements', { method: 'POST', body: JSON.stringify(payload) }); showToast('Posted!'); }
        closeModal(); loadAnnouncements();
      } catch (err) { showToast(err.message, 'error');
      } finally { btn.disabled = false; btn.textContent = editingId ? 'Save Changes' : 'Post'; }
    });

    async function editAnn(id) {
      try {
        const data = await api('/api/announcements?all=1');
        const ann = data.data.find(a => a._id === id || String(a._id) === String(id));
        if (ann) openModal(ann);
      } catch { showToast('Failed to load.', 'error'); }
    }

    async function toggleActive(id, currentActive) {
      try {
        await api(`/api/announcements/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: currentActive ? '0' : '1' }) });
        showToast(currentActive ? 'Deactivated.' : 'Activated!');
        loadAnnouncements();
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function deleteAnn(id, title) {
      const confirmed = await confirmDelete(`Delete "${title}"? This cannot be undone.`);
      if (!confirmed) return;
      try { await api(`/api/announcements/${id}`, { method: 'DELETE' }); showToast('Deleted.'); loadAnnouncements(); }
      catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
  </script>
</body>
</html>
