<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documents Management | MAGIC Youth Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0f13; }
    input, select, textarea { background: #1a1a2e !important; border-color: #374151 !important; color: #f3f4f6 !important; }
    input:focus, select:focus, textarea:focus { border-color: #7c3aed !important; outline: none !important; box-shadow: 0 0 0 2px rgba(124,58,237,0.2) !important; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }
  </style>
</head>
<body class="text-gray-100">
  <div id="sidebarContainer"></div>

  <div class="md:ml-64 min-h-screen">
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-800 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-lg font-bold text-white">Documents & Reports</h1>
          <p class="text-gray-500 text-xs">Manage all uploaded documents, reports, and files</p>
        </div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        Upload Document
      </button>
    </header>

    <main class="p-6">
      <!-- Filters -->
      <div class="flex flex-wrap gap-3 mb-6">
        <select id="filterCat" onchange="loadDocs()" class="rounded-xl px-4 py-2 text-sm border">
          <option value="">All Categories</option>
          <option>Event Reports</option>
          <option>Annual Reports</option>
          <option>Magazines</option>
          <option>Certificates</option>
          <option>Letters/Documents</option>
        </select>
        <input type="text" id="filterYear" placeholder="Academic Year" onkeyup="loadDocs()" class="rounded-xl px-4 py-2 text-sm border w-48">
      </div>

      <!-- Documents Table -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
              <th class="px-6 py-4 text-left">Document</th>
              <th class="px-6 py-4 text-left hidden md:table-cell">Category</th>
              <th class="px-6 py-4 text-left hidden lg:table-cell">Event / Date</th>
              <th class="px-6 py-4 text-left hidden md:table-cell">Year</th>
              <th class="px-6 py-4 text-left">Download</th>
              <th class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="docsTableBody">
            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Loading documents...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Upload Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-800">
        <h2 class="text-lg font-semibold text-white" id="modalTitle">Upload Document</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="docForm" class="p-6 space-y-4" enctype="multipart/form-data">
        <input type="hidden" id="docId">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Title *</label>
          <input type="text" id="docTitle" required placeholder="e.g. Chess Tournament Report 2024" class="w-full rounded-xl px-4 py-2.5 text-sm border">
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Category</label>
            <select id="docCategory" class="w-full rounded-xl px-4 py-2.5 text-sm border">
              <option>Event Reports</option>
              <option>Annual Reports</option>
              <option>Magazines</option>
              <option>Certificates</option>
              <option>Letters/Documents</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Academic Year</label>
            <input type="text" id="docYear" placeholder="e.g. 2024-25" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Related Event</label>
            <input type="text" id="docEvent" placeholder="Event name" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Event Date</label>
            <input type="date" id="docEventDate" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Description</label>
          <textarea id="docDesc" rows="2" placeholder="Brief description of this document" class="w-full rounded-xl px-4 py-2.5 text-sm border resize-none"></textarea>
        </div>
        <div class="flex items-center gap-3">
          <input type="checkbox" id="docDownloadable" class="w-4 h-4 accent-purple-500 bg-gray-800 border-gray-600 rounded" checked>
          <label for="docDownloadable" class="text-sm text-gray-300">Allow public download</label>
        </div>
        <div id="fileUploadSection">
          <label class="block text-xs font-medium text-gray-400 mb-1.5">File *</label>
          <input type="file" id="docFile" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" class="w-full rounded-xl px-4 py-2.5 text-sm border file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-900/40 file:text-blue-300 file:text-xs hover:file:bg-blue-900/60 cursor-pointer">
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-700 text-gray-300 hover:bg-gray-800 text-sm transition">Cancel</button>
          <button type="submit" id="submitBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    const CATEGORIES = { 'Event Reports': '📋', 'Annual Reports': '📊', 'Magazines': '📰', 'Certificates': '🏆', 'Letters/Documents': '📄' };
    let editingId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadSidebar('documents');
      loadDocs();
    });

    async function loadDocs() {
      const cat = document.getElementById('filterCat').value;
      const year = document.getElementById('filterYear').value;
      let url = '/api/documents?';
      if (cat) url += `category=${encodeURIComponent(cat)}&`;
      if (year) url += `year=${encodeURIComponent(year)}&`;

      try {
        const data = await api(url);
        renderTable(data.data);
      } catch (err) { showToast('Failed to load documents.', 'error'); }
    }

    function renderTable(docs) {
      const tbody = document.getElementById('docsTableBody');
      if (docs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">No documents yet. <button onclick="openModal()" class="text-blue-400 hover:underline">Upload one!</button></td></tr>`;
        return;
      }
      tbody.innerHTML = docs.map(d => `
        <tr class="border-b border-gray-800 hover:bg-white/[0.02] transition">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${CATEGORIES[d.category] || '📄'}</span>
              <span class="text-white font-medium text-sm">${d.title}</span>
            </div>
          </td>
          <td class="px-6 py-4 text-gray-400 hidden md:table-cell text-sm">${d.category}</td>
          <td class="px-6 py-4 text-gray-400 hidden lg:table-cell text-sm">${d.eventName || '—'} ${d.eventDate ? '· '+formatDate(d.eventDate) : ''}</td>
          <td class="px-6 py-4 text-gray-400 hidden md:table-cell text-sm">${d.academicYear || '—'}</td>
          <td class="px-6 py-4">
            ${d.isDownloadable
              ? `<a href="/uploads/documents/${d.filename}" download class="inline-flex items-center gap-1 text-xs text-green-400 hover:text-green-300"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Download</a>`
              : `<span class="text-xs text-gray-600">View only</span>`}
          </td>
          <td class="px-6 py-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <a href="/uploads/documents/${d.filename}" target="_blank" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-blue-400 transition" title="View">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </a>
              <button onclick="editDoc('${d._id}')" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-purple-400 transition" title="Edit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button onclick="deleteDoc('${d._id}', '${d.title.replace(/'/g, "\\'")}')"
                class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-red-400 transition" title="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openModal(data = null) {
      editingId = data ? data._id : null;
      document.getElementById('modalTitle').textContent = data ? 'Edit Document' : 'Upload Document';
      document.getElementById('docId').value = data?._id || '';
      document.getElementById('docTitle').value = data?.title || '';
      document.getElementById('docCategory').value = data?.category || 'Event Reports';
      document.getElementById('docYear').value = data?.academicYear || '';
      document.getElementById('docEvent').value = data?.eventName || '';
      document.getElementById('docEventDate').value = data?.eventDate ? data.eventDate.substring(0,10) : '';
      document.getElementById('docDesc').value = data?.description || '';
      document.getElementById('docDownloadable').checked = data ? !!data.isDownloadable : true;
      document.getElementById('fileUploadSection').style.display = data ? 'none' : 'block';
      document.getElementById('submitBtn').textContent = data ? 'Save Changes' : 'Upload';
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); editingId = null; }

    async function editDoc(id) {
      try {
        const data = await api(`/api/documents/${id}`);
        openModal(data.data);
      } catch { showToast('Failed to load document.', 'error'); }
    }

    document.getElementById('docForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = editingId ? 'Saving...' : 'Uploading...';

      try {
        if (editingId) {
          await api(`/api/documents/${editingId}`, {
            method: 'PUT',
            body: JSON.stringify({
              title: document.getElementById('docTitle').value,
              category: document.getElementById('docCategory').value,
              academic_year: document.getElementById('docYear').value,
              event_name: document.getElementById('docEvent').value,
              event_date: document.getElementById('docEventDate').value,
              description: document.getElementById('docDesc').value,
              is_downloadable: document.getElementById('docDownloadable').checked
            })
          });
          showToast('Document updated!');
        } else {
          const file = document.getElementById('docFile').files[0];
          if (!file) { showToast('Please select a file.', 'warning'); return; }
          const form = new FormData();
          form.append('file', file);
          form.append('title', document.getElementById('docTitle').value);
          form.append('category', document.getElementById('docCategory').value);
          form.append('academic_year', document.getElementById('docYear').value);
          form.append('event_name', document.getElementById('docEvent').value);
          form.append('event_date', document.getElementById('docEventDate').value);
          form.append('description', document.getElementById('docDesc').value);
          form.append('is_downloadable', document.getElementById('docDownloadable').checked);
          const res = await fetch('/api/documents', { method: 'POST', body: form });
          const data = await res.json();
          if (!data.success) throw new Error(data.message);
          showToast('Document uploaded!');
        }
        closeModal();
        loadDocs();
      } catch (err) { showToast(err.message, 'error');
      } finally { btn.disabled = false; btn.textContent = editingId ? 'Save Changes' : 'Upload'; }
    });

    async function deleteDoc(id, title) {
      const confirmed = await confirmDelete(`Delete "${title}"?`);
      if (!confirmed) return;
      try {
        await api(`/api/documents/${id}`, { method: 'DELETE' });
        showToast('Document deleted.');
        loadDocs();
      } catch (err) { showToast(err.message, 'error'); }
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
