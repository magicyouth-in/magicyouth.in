<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Management | MAGIC Youth Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0f13; }
    .modal-overlay { background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); }
    input, select, textarea { background: #1a1a2e !important; border-color: #374151 !important; color: #f3f4f6 !important; }
    input:focus, select:focus, textarea:focus { border-color: #7c3aed !important; outline: none !important; box-shadow: 0 0 0 2px rgba(124,58,237,0.2) !important; }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }
  </style>
</head>
<body class="text-gray-100">
  <div id="sidebarContainer"></div>

  <div class="md:ml-64 min-h-screen">
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-800 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-lg font-bold text-white">Events Management</h1>
          <p class="text-gray-500 text-xs">Add, edit, and manage all MAGIC Youth events</p>
        </div>
      </div>
      <button onclick="openModal()" class="flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Add Event
      </button>
    </header>

    <main class="p-6">
      <!-- Filters -->
      <div class="flex flex-wrap gap-3 mb-6">
        <select id="filterStatus" onchange="loadEvents()" class="rounded-xl px-4 py-2 text-sm border">
          <option value="">All Status</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Completed</option>
        </select>
        <input type="text" id="filterYear" placeholder="Academic Year (e.g. 2024-25)" onkeyup="loadEvents()" class="rounded-xl px-4 py-2 text-sm border w-52">
      </div>

      <!-- Events Table -->
      <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-gray-800 text-gray-500 text-xs uppercase tracking-wider">
              <th class="px-6 py-4 text-left">Event</th>
              <th class="px-6 py-4 text-left hidden md:table-cell">Date</th>
              <th class="px-6 py-4 text-left hidden lg:table-cell">Venue</th>
              <th class="px-6 py-4 text-left hidden md:table-cell">Year</th>
              <th class="px-6 py-4 text-left">Status</th>
              <th class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="eventsTableBody">
            <tr><td colspan="6" class="px-6 py-8 text-center text-gray-500">Loading events...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between px-6 py-5 border-b border-gray-800">
        <h2 class="text-lg font-semibold text-white" id="modalTitle">Add New Event</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-white transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="eventForm" class="p-6 space-y-4" enctype="multipart/form-data">
        <input type="hidden" id="eventId">

        <div class="grid md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Event Title *</label>
            <input type="text" id="evTitle" required placeholder="e.g. Chess Tournament" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Date</label>
            <input type="date" id="evDate" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Academic Year</label>
            <input type="text" id="evYear" placeholder="e.g. 2024-25" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Venue / Location</label>
            <input type="text" id="evVenue" placeholder="e.g. Andhra Loyola College, Vijayawada" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Description</label>
            <textarea id="evDesc" rows="3" placeholder="Describe the event..." class="w-full rounded-xl px-4 py-2.5 text-sm border resize-none"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Organizers</label>
            <input type="text" id="evOrganizers" placeholder="Names of organizers" class="w-full rounded-xl px-4 py-2.5 text-sm border">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Status</label>
            <select id="evStatus" class="w-full rounded-xl px-4 py-2.5 text-sm border">
              <option value="upcoming">Upcoming</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-400 mb-1.5">Event Poster / Image</label>
            <input type="file" id="evPoster" accept="image/*" class="w-full rounded-xl px-4 py-2.5 text-sm border file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-purple-900/40 file:text-purple-300 file:text-xs hover:file:bg-purple-900/60 cursor-pointer">
            <div id="currentPosterPreview" class="hidden mt-2"></div>
          </div>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-xl border border-gray-700 text-gray-300 hover:bg-gray-800 text-sm transition">Cancel</button>
          <button type="submit" id="submitBtn" class="flex-1 px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    let editingId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadSidebar('events');
      loadEvents();
    });

    async function loadEvents() {
      const status = document.getElementById('filterStatus').value;
      const year = document.getElementById('filterYear').value;
      let url = '/api/events?';
      if (status) url += `status=${status}&`;
      if (year) url += `year=${encodeURIComponent(year)}&`;

      try {
        const data = await api(url);
        renderTable(data.data);
      } catch (err) {
        showToast('Failed to load events.', 'error');
      }
    }

    function renderTable(events) {
      const tbody = document.getElementById('eventsTableBody');
      if (events.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-gray-500">No events found. <button onclick="openModal()" class="text-purple-400 hover:underline">Add the first one!</button></td></tr>`;
        return;
      }
    tbody.innerHTML = events.map(e => `
        <tr class="border-b border-gray-800 hover:bg-white/[0.02] transition">
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              ${e.posterImage
                ? `<img src="/uploads/events/${e.posterImage}" class="w-10 h-10 rounded-lg object-cover flex-shrink-0">`
                : `<div class="w-10 h-10 rounded-lg bg-purple-900/30 flex items-center justify-center flex-shrink-0"><svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`}
              <span class="text-white font-medium">${e.title}</span>
            </div>
          </td>
          <td class="px-6 py-4 text-gray-400 hidden md:table-cell">${formatDate(e.date)}</td>
          <td class="px-6 py-4 text-gray-400 hidden lg:table-cell truncate max-w-xs">${e.venue || '—'}</td>
          <td class="px-6 py-4 text-gray-400 hidden md:table-cell">${e.academicYear || '—'}</td>
          <td class="px-6 py-4">${statusBadge(e.status)}</td>
          <td class="px-6 py-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button onclick="editEvent('${e._id}')" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-purple-400 transition" title="Edit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button onclick="deleteEvent('${e._id}', '${e.title.replace(/'/g, "\\'")}')"
                class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 hover:text-red-400 transition" title="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openModal(data = null) {
      editingId = data ? data._id : null;
      document.getElementById('modalTitle').textContent = data ? 'Edit Event' : 'Add New Event';
      document.getElementById('eventId').value = data?._id || '';
      document.getElementById('evTitle').value = data?.title || '';
      document.getElementById('evDate').value = data?.date ? data.date.substring(0,10) : '';
      document.getElementById('evYear').value = data?.academicYear || '';
      document.getElementById('evVenue').value = data?.venue || '';
      document.getElementById('evDesc').value = data?.description || '';
      document.getElementById('evOrganizers').value = data?.organizers || '';
      document.getElementById('evStatus').value = data?.status || 'upcoming';
      document.getElementById('evPoster').value = '';

      const preview = document.getElementById('currentPosterPreview');
      if (data?.posterImage) {
        preview.innerHTML = `<img src="/uploads/events/${data.posterImage}" class="h-20 rounded-lg object-cover"> <p class="text-xs text-gray-500 mt-1">Current poster (upload new to replace)</p>`;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
        preview.innerHTML = '';
      }

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      editingId = null;
    }

    async function editEvent(id) {
      try {
        const data = await api(`/api/events/${id}`);
        openModal(data.data);
      } catch (err) {
        showToast('Failed to load event.', 'error');
      }
    }

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Saving...';

      const form = new FormData();
      form.append('title', document.getElementById('evTitle').value);
      form.append('date', document.getElementById('evDate').value);
      form.append('academic_year', document.getElementById('evYear').value);
      form.append('venue', document.getElementById('evVenue').value);
      form.append('description', document.getElementById('evDesc').value);
      form.append('organizers', document.getElementById('evOrganizers').value);
      form.append('status', document.getElementById('evStatus').value);
      const poster = document.getElementById('evPoster').files[0];
      if (poster) form.append('poster_image', poster);

      try {
        const url = editingId ? `/api/events/${editingId}` : '/api/events';
        const method = editingId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, body: form });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        showToast(editingId ? 'Event updated!' : 'Event created!');
        closeModal();
        loadEvents();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Save Event';
      }
    });

    async function deleteEvent(id, title) {
      const confirmed = await confirmDelete(`Delete "${title}"? This cannot be undone.`);
      if (!confirmed) return;
      try {
        await api(`/api/events/${id}`, { method: 'DELETE' });
        showToast('Event deleted.');
        loadEvents();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    // Close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modal')) closeModal();
    });
  </script>
</body>
</html>
