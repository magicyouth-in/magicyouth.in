<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | MAGIC Youth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .input-field {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.12);
      border-color: rgba(167,139,250,0.7);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
      outline: none;
    }
    .btn-login {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      transition: all 0.3s ease;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(124,58,237,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    @keyframes float {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    .floating { animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-black to-purple-800 flex items-center justify-center px-4">

  <!-- Background decorative circles -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-purple-600 rounded-full opacity-10 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600 rounded-full opacity-10 blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-purple-500 rounded-full opacity-5 blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    <!-- Logo & Header -->
    <div class="text-center mb-8 floating">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-purple-500 to-indigo-600 shadow-2xl mb-4">
        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">MAGIC Youth</h1>
      <p class="text-purple-300 text-sm mt-1">Admin Portal</p>
    </div>

    <!-- Login Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-semibold text-white mb-6 text-center">Sign in to Dashboard</h2>

      <!-- Error / Success Messages -->
      <div id="alertBox" class="hidden mb-4 px-4 py-3 rounded-lg text-sm font-medium"></div>

      <form id="loginForm" class="space-y-5">
        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-medium text-purple-200 mb-2">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
            placeholder="Enter username"
            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm"
          />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-purple-200 mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Enter password"
              class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm pr-12"
            />
            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-purple-300 transition-colors">
              <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          id="loginBtn"
          class="btn-login w-full py-3 rounded-xl text-white font-semibold text-sm tracking-wide"
        >
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/index.html" class="text-purple-400 hover:text-purple-300 text-sm transition-colors">
          ← Back to MAGIC Youth Website
        </a>
      </div>
    </div>

    <p class="text-center text-gray-600 text-xs mt-6">
      © 2025 MAGIC Youth | Secure Admin Portal
    </p>
  </div>

  <script>
    // Toggle password visibility
    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    // Show alert message
    function showAlert(message, type) {
      const box = document.getElementById('alertBox');
      box.className = `mb-4 px-4 py-3 rounded-lg text-sm font-medium ${
        type === 'error'
          ? 'bg-red-900/40 border border-red-500/50 text-red-300'
          : 'bg-green-900/40 border border-green-500/50 text-green-300'
      }`;
      box.textContent = message;
      box.classList.remove('hidden');
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 800);
        } else {
          showAlert(data.message || 'Invalid credentials.', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        showAlert('Connection error. Is the server running?', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // If already logged in, redirect to dashboard
    fetch('/api/auth/status').then(r => r.json()).then(d => {
      if (d.loggedIn) window.location.href = '/admin/dashboard.html';
    });
  </script>
</body>
</html>
