<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | MAGIC Youth Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f0f13; }
    .stat-card { background: linear-gradient(135deg, rgba(124,58,237,0.12), rgba(99,102,241,0.06)); border: 1px solid rgba(124,58,237,0.2); transition: all 0.3s ease; }
    .stat-card:hover { border-color: rgba(124,58,237,0.4); transform: translateY(-2px); }
    .table-row:hover { background: rgba(255,255,255,0.03); }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: #1a1a2e; } ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }
  </style>
</head>
<body class="text-gray-100">
  <div id="sidebarContainer"></div>

  <!-- Main Content -->
  <div class="md:ml-64 min-h-screen">
    <!-- Top Bar -->
    <header class="sticky top-0 z-40 bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleMobileSidebar()" class="md:hidden p-2 rounded-lg hover:bg-gray-800 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 class="text-lg font-bold text-white">Dashboard</h1>
          <p class="text-gray-500 text-xs">MAGIC Youth Overview</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-500" id="currentDate"></span>
      </div>
    </header>

    <main class="p-6">
      <!-- Stats Grid -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="stat-card rounded-2xl p-5">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-purple-600/20 flex items-center justify-center">
              <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
          </div>
          <p class="text-3xl font-bold text-white" id="statEvents">—</p>
          <p class="text-gray-500 text-sm mt-1">Total Events</p>
          <p class="text-xs text-purple-400 mt-1" id="statUpcoming"></p>
        </div>
        <div class="stat-card rounded-2xl p-5">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600/20 flex items-center justify-center">
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
          </div>
          <p class="text-3xl font-bold text-white" id="statPhotos">—</p>
          <p class="text-gray-500 text-sm mt-1">Gallery Photos</p>
        </div>
        <div class="stat-card rounded-2xl p-5">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600/20 flex items-center justify-center">
              <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
          </div>
          <p class="text-3xl font-bold text-white" id="statDocs">—</p>
          <p class="text-gray-500 text-sm mt-1">Documents</p>
        </div>
        <div class="stat-card rounded-2xl p-5">
          <div class="flex items-start justify-between mb-3">
            <div class="w-10 h-10 rounded-xl bg-green-600/20 flex items-center justify-center">
              <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
          </div>
          <p class="text-3xl font-bold text-white" id="statTeam">—</p>
          <p class="text-gray-500 text-sm mt-1">Current Team</p>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
        <a href="/admin/events.html" class="flex items-center gap-3 p-4 rounded-xl bg-purple-900/20 border border-purple-800/30 hover:bg-purple-900/30 hover:border-purple-700/50 transition-all">
          <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span class="text-sm text-purple-300 font-medium">Add Event</span>
        </a>
        <a href="/admin/gallery.html" class="flex items-center gap-3 p-4 rounded-xl bg-indigo-900/20 border border-indigo-800/30 hover:bg-indigo-900/30 hover:border-indigo-700/50 transition-all">
          <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span class="text-sm text-indigo-300 font-medium">Upload Photos</span>
        </a>
        <a href="/admin/documents.html" class="flex items-center gap-3 p-4 rounded-xl bg-blue-900/20 border border-blue-800/30 hover:bg-blue-900/30 hover:border-blue-700/50 transition-all">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          <span class="text-sm text-blue-300 font-medium">Upload Report</span>
        </a>
        <a href="/admin/announcements.html" class="flex items-center gap-3 p-4 rounded-xl bg-yellow-900/20 border border-yellow-800/30 hover:bg-yellow-900/30 hover:border-yellow-700/50 transition-all">
          <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>
          <span class="text-sm text-yellow-300 font-medium">Announcement</span>
        </a>
      </div>

      <div class="grid md:grid-cols-2 gap-6">
        <!-- Recent Events -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
            <h2 class="font-semibold text-white">Recent Events</h2>
            <a href="/admin/events.html" class="text-purple-400 hover:text-purple-300 text-sm transition">View all →</a>
          </div>
          <div id="recentEvents" class="divide-y divide-gray-800">
            <div class="px-6 py-4 text-gray-500 text-sm">Loading...</div>
          </div>
        </div>

        <!-- Recent Messages -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden">
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
            <h2 class="font-semibold text-white">Contact Messages</h2>
            <span class="text-gray-500 text-sm" id="msgCount"></span>
          </div>
          <div id="recentMessages" class="divide-y divide-gray-800">
            <div class="px-6 py-4 text-gray-500 text-sm">Loading...</div>
          </div>
        </div>
      </div>

      <!-- Change Password Section -->
      <div class="mt-6 bg-gray-900 border border-gray-800 rounded-2xl p-6">
        <h2 class="font-semibold text-white mb-4 flex items-center gap-2">
          <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          Change Password
        </h2>
        <form id="changePasswordForm" class="grid md:grid-cols-3 gap-4">
          <input type="password" id="currentPassword" placeholder="Current password" class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:border-purple-500 focus:outline-none">
          <input type="password" id="newPassword" placeholder="New password (min 8 chars)" class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:border-purple-500 focus:outline-none">
          <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white rounded-xl px-6 py-2.5 text-sm font-medium transition">Update Password</button>
        </form>
      </div>
    </main>
  </div>

  <script src="/admin/admin.js"></script>
  <script>
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    document.addEventListener('DOMContentLoaded', async () => {
      await loadSidebar('dashboard');
      loadStats();
    });

    async function loadStats() {
      try {
        const data = await api('/api/stats');
        const s = data.data;
        document.getElementById('statEvents').textContent = s.totalEvents;
        document.getElementById('statUpcoming').textContent = `${s.upcomingEvents} upcoming`;
        document.getElementById('statPhotos').textContent = s.totalPhotos;
        document.getElementById('statDocs').textContent = s.totalDocuments;
        document.getElementById('statTeam').textContent = s.currentTeam;
        document.getElementById('msgCount').textContent = `${s.totalMessages} total`;

        // Recent events
        const eventsEl = document.getElementById('recentEvents');
        if (s.recentEvents.length === 0) {
          eventsEl.innerHTML = '<div class="px-6 py-4 text-gray-500 text-sm">No events yet. <a href="/admin/events.html" class="text-purple-400">Add one →</a></div>';
        } else {
          eventsEl.innerHTML = s.recentEvents.map(e => `
            <div class="table-row px-6 py-3 flex items-center justify-between gap-2">
              <div>
                <p class="text-sm text-white font-medium">${e.title}</p>
                <p class="text-xs text-gray-500">${formatDate(e.date)}</p>
              </div>
              ${statusBadge(e.status)}
            </div>
          `).join('');
        }

        // Recent messages
        const msgsEl = document.getElementById('recentMessages');
        if (s.recentMessages.length === 0) {
          msgsEl.innerHTML = '<div class="px-6 py-4 text-gray-500 text-sm">No messages yet.</div>';
        } else {
          msgsEl.innerHTML = s.recentMessages.map(m => `
            <div class="table-row px-6 py-3">
              <p class="text-sm text-white font-medium">${m.name}</p>
              <p class="text-xs text-gray-400 truncate">${m.query || ''}</p>
              <p class="text-xs text-gray-600 mt-0.5">${formatDate(m.createdAt)}</p>
            </div>
          `).join('');
        }
      } catch (err) {
        showToast('Failed to load dashboard data.', 'error');
      }
    }

    document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      try {
        await api('/api/auth/change-password', {
          method: 'POST',
          body: JSON.stringify({ currentPassword, newPassword })
        });
        showToast('Password changed successfully!');
        e.target.reset();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
